
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Om Voice Studio</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b0b12;color:#f5f5f5;
  font-family:Arial,sans-serif;padding:20px
}
main{max-width:720px;margin:20px auto}
h1{color:#ff4545}
p{color:#b9bac8;line-height:1.6}
.panel{
  background:#171722;border:1px solid #303041;
  border-radius:16px;padding:18px
}
textarea,select,input{
  width:100%;margin:8px 0 16px;padding:12px;
  border-radius:9px;border:1px solid #414155;
  background:#101019;color:white;font-size:16px
}
textarea{height:190px;resize:vertical}
label{font-size:14px;color:#dedee8}
button{
  padding:12px 16px;border:0;border-radius:9px;
  background:#ff4545;color:white;font-weight:bold;
  margin:4px;cursor:pointer
}
button.secondary{background:#343444}
button:disabled{opacity:.5}
#status{min-height:24px;color:#ffc16b}
footer{font-size:12px;color:#9999aa;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>🎙️ OM VOICE STUDIO</h1>
  <p>अपनी कहानी को आवाज़ में सुनो। Hindi • English • Hinglish</p>

  <section class="panel">
    <label for="script">अपनी स्क्रिप्ट लिखो</label>
    <textarea id="script"
      placeholder="यहाँ अपनी कहानी लिखो..."></textarea>

    <label for="language">भाषा / Voice Accent</label>
    <select id="language">
      <option value="hi-IN">Hindi</option>
      <option value="en-IN">English (India)</option>
      <option value="en-US">English (US)</option>
    </select>

    <label for="voice">उपलब्ध आवाज़</label>
    <select id="voice">
      <option value="">Default voice</option>
    </select>

    <label for="rate">बोलने की स्पीड</label>
    <input id="rate" type="range" min="0.65"
      max="1.3" step="0.05" value="0.9">

    <label for="pitch">आवाज़ की पिच</label>
    <input id="pitch" type="range" min="0.65"
      max="1.3" step="0.05" value="0.85">

    <button id="speak">▶ सुनो</button>
    <button id="pause" class="secondary">⏸ रोकें</button>
    <button id="stop" class="secondary">⏹ बंद करें</button>
    <button id="copy" class="secondary">📋 टेक्स्ट कॉपी</button>

    <p id="status" role="status">आवाज़ लोड हो रही है...</p>
  </section>

  <footer>
    यह शुरुआती वर्जन ब्राउज़र की आवाज़ इस्तेमाल करता है।
    MP3 बनाने के लिए अलग TTS इंजन जोड़ना होगा।
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
let voices = [];

function loadVoices(){
  voices = synth.getVoices();
  const select = $("voice");
  const previous = select.value;
  select.replaceChildren(new Option("Default voice", ""));

  voices.forEach((v, i) => {
    select.add(new Option(`${v.name} (${v.lang})`, String(i)));
  });

  if (previous && voices[Number(previous)]) {
    select.value = previous;
  }
}

function updateLanguage(){
  const lang = $("language").value;
  const filtered = voices.filter(v =>
    lang === "hi-IN"
      ? v.lang.toLowerCase().startsWith("hi")
      : v.lang.toLowerCase().startsWith("en")
  );

  const select = $("voice");
  const previous = select.value;
  select.replaceChildren(new Option("Default voice", ""));

  filtered.forEach(v => {
    const index = voices.indexOf(v);
    select.add(new Option(`${v.name} (${v.lang})`, String(index)));
  });

  if (previous && filtered.some(v =>
    String(voices.indexOf(v)) === previous
  )) select.value = previous;
}

if ("speechSynthesis" in window) {
  loadVoices();
  synth.onvoiceschanged = () => {
    loadVoices();
    updateLanguage();
  };
  $("language").addEventListener("change", updateLanguage);
} else {
  $("status").textContent = "इस ब्राउज़र में वॉइस सपोर्ट उपलब्ध नहीं है।";
  $("speak").disabled = true;
}

$("speak").onclick = () => {
  const text = $("script").value.trim();
  if (!text) {
    $("status").textContent = "पहले अपनी स्क्रिप्ट लिखो।";
    return;
  }

  synth.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = $("language").value;
  utterance.rate = Number($("rate").value);
  utterance.pitch = Number($("pitch").value);

  const chosen = $("voice").value;
  if (chosen !== "" && voices[Number(chosen)]) {
    utterance.voice = voices[Number(chosen)];
  }

  utterance.onstart = () => {
    $("status").textContent = "आवाज़ चल रही है...";
  };
  utterance.onend = () => {
    $("status").textContent = "प्लेबैक पूरा हुआ।";
  };
  utterance.onerror = () => {
    $("status").textContent = "आवाज़ चलाने में समस्या हुई।";
  };

  synth.speak(utterance);
};

$("pause").onclick = () => {
  if (synth.speaking && !synth.paused) synth.pause();
  else if (synth.paused) synth.resume();
};

$("stop").onclick = () => {
  synth.cancel();
  $("status").textContent = "प्लेबैक बंद किया गया।";
};

$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText($("script").value);
    $("status").textContent = "टेक्स्ट कॉपी हो गया।";
  } catch {
    $("status").textContent =
      "टेक्स्ट को चुनकर मैन्युअल कॉपी करें।";
  }
};
</script>
</body>
</html>
