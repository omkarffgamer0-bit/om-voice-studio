
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Om Voice Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b12;color:#f5f5f5;font-family:Arial,sans-serif;padding:20px}
main{max-width:720px;margin:20px auto}
h1{color:#ff4545;text-align:center}
p{color:#b9bac8;line-height:1.6}
.panel{background:#171722;border:1px solid #303041;border-radius:16px;padding:18px;margin-top:18px}
label{display:block;margin:14px 0 7px;color:#dedee8;font-size:14px}
textarea,select,input{width:100%;padding:12px;border-radius:9px;border:1px solid #414155;background:#101019;color:white;font-size:16px}
textarea{height:190px;resize:vertical}
button{padding:12px 16px;border:0;border-radius:9px;background:#ff4545;color:white;font-weight:bold;margin:5px 3px 5px 0;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#343444}
#status{min-height:30px;margin-top:14px;overflow-wrap:anywhere}
audio{width:100%;margin-top:15px}
footer{font-size:12px;color:#9999aa;margin-top:20px;text-align:center}
</style>
</head>
<body>
<main>
<h1>🎙️ OM VOICE STUDIO</h1>
<p style="text-align:center">अपनी कहानी को AI आवाज़ में बदलें — Hindi, English और Hinglish.</p>

<section class="panel">
<label for="script">अपना स्क्रिप्ट लिखें</label>
<textarea id="script" maxlength="3000" placeholder="यहाँ अपनी कहानी या डायलॉग लिखें..."></textarea>
<p id="count">0 / 3000 characters</p>

<label for="language">भाषा / Voice Accent</label>
<select id="language">
<option value="Hindi">Hindi</option>
<option value="English (India)">English (India)</option>
<option value="English (US)">English (US)</option>
<option value="Hinglish">Hinglish</option>
</select>

<label for="voice">आवाज़ चुनें</label>
<select id="voice">
<option value="Kore">Kore — Clear</option>
<option value="Puck">Puck — Energetic</option>
<option value="Charon">Charon — Deep narration</option>
<option value="Fenrir">Fenrir — Strong</option>
<option value="Aoede">Aoede — Smooth</option>
<option value="Leda">Leda — Soft</option>
<option value="Orus">Orus — Firm</option>
<option value="Zephyr">Zephyr — Bright</option>
</select>

<label for="style">आवाज़ का स्टाइल</label>
<select id="style">
<option value="Natural, clear narration">Natural Narration</option>
<option value="Deep, cinematic, dramatic storytelling">Cinematic / Dark</option>
<option value="Energetic, exciting YouTube narration">YouTube Energetic</option>
<option value="Emotional, slow, expressive storytelling">Emotional Story</option>
<option value="Calm, soft and friendly">Calm Voice</option>
<option value="Suspenseful thriller narration with dramatic pauses">Thriller / Suspense</option>
</select>

<button id="generate">🎙️ Generate AI Voice</button>
<p id="status" role="status">अपना टेक्स्ट लिखकर Generate दबाएँ।</p>
<audio id="player" controls hidden></audio>
<br>
<button id="download" class="secondary" hidden>⬇️ Download WAV</button>
</section>

<footer>Om Voice Studio · AI-generated audio · इंटरनेट कनेक्शन ज़रूरी है</footer>
</main>

<script>
const API_URL = "https://om-voice-api.omkarffgamer0.workers.dev";

const script = document.getElementById("script");
const count = document.getElementById("count");
const statusBox = document.getElementById("status");
const generate = document.getElementById("generate");
const player = document.getElementById("player");
const download = document.getElementById("download");

let audioUrl = null;

script.addEventListener("input", () => {
  count.textContent = script.value.length + " / 3000 characters";
});

generate.addEventListener("click", async () => {
  const text = script.value.trim();

  if (!text) {
    statusBox.textContent = "पहले अपना स्क्रिप्ट लिखें।";
    return;
  }

  generate.disabled = true;
  download.hidden = true;
  player.hidden = true;
  statusBox.textContent = "AI आवाज़ बना रहा है... कृपया इंतज़ार करें।";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        text: text,
        voice: document.getElementById("voice").value,
        style:
          document.getElementById("style").value +
          ". Speak in " +
          document.getElementById("language").value +
          ". Pronounce clearly and naturally."
      })
    });

    if (!response.ok) {
      let message = "Request failed (" + response.status + ")";
      try {
        const errorData = await response.json();
        message = errorData.details || errorData.error || message;
      } catch (_) {}
      throw new Error(message);
    }

    const blob = await response.blob();

    if (!blob.size) {
      throw new Error("खाली ऑडियो मिला। फिर से कोशिश करें।");
    }

    if (audioUrl) URL.revokeObjectURL(audioUrl);
    audioUrl = URL.createObjectURL(blob);

    player.src = audioUrl;
    player.hidden = false;
    download.hidden = false;
    statusBox.textContent = "✅ आवाज़ तैयार है! सुनें या डाउनलोड करें।";
  } catch (error) {
    statusBox.textContent = "❌ समस्या: " + error.message;
  } finally {
    generate.disabled = false;
  }
});

download.addEventListener("click", () => {
  if (!audioUrl) return;
  const link = document.createElement("a");
  link.href = audioUrl;
  link.download = "om-voice.wav";
  document.body.appendChild(link);
  link.click();
  link.remove();
});
</script>
</body>
</html>
